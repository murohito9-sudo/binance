# Fly.io — deploy dengan: fly launch --copy-config --no-deploy
# lalu: fly secrets set DATABASE_URL=... MANUS_API_KEY=... (lihat docs/deploy.md)
app = "nalar-ai"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  LOG_LEVEL = "info"
  NODE_ENV = "production"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/live"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
