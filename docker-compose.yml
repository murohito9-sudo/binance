services:
  db:
    image: mysql:8
    environment:
      MYSQL_DATABASE: nalarai
      MYSQL_USER: nalar
      MYSQL_PASSWORD: nalar
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-unalar", "-pnalar"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: mysql://nalar:nalar@db:3306/nalarai
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
